<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da TV</title>
<style>
:root{color-scheme:dark;--bg:#0c1118;--card:#161d28;--tx:#f3f6fb;--mu:#8d99ab;--c1:#5ab0ff;--c2:#ff8fb8}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.grid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:1.6vw;padding:2vw}
.card{background:var(--card);border-radius:1.6vw;padding:1.8vw;min-height:0;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:1.5vw}
#time{font-size:min(8vw,17vh);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#date{font-size:min(1.9vw,3.6vh);color:var(--mu);margin-top:.8vh}
#greet{font-size:min(1.6vw,3vh);color:var(--c1);margin-top:.6vh}
.weather{display:flex;align-items:center;gap:1.2vw;padding-left:1.5vw;border-left:1px solid #243041}
#wi{font-size:min(6vw,11vh)}
#wt{font-size:min(4vw,8vh);font-weight:700;line-height:1}
#wc{font-size:min(1.6vw,3vh);margin-top:.4vh}
#wm{font-size:min(1.3vw,2.5vh);color:var(--mu);margin-top:.4vh}
.ahead,.r{display:grid;grid-template-columns:6ch 1fr 1fr;gap:1.2vw}
.ahead{padding-bottom:1vh;border-bottom:2px solid #2b3849}
.ahead h2{margin:0;font-size:min(1.9vw,3.6vh);letter-spacing:.05em}
.ahead .c{color:var(--c1)}.ahead .i{color:var(--c2)}
.r{padding:.9vh 0;border-bottom:1px solid #243041;font-size:calc(min(1.9vw,3.7vh)*var(--k,1));align-items:start}
.agenda{display:flex;flex-direction:column}
#agb{flex:1;min-height:0;overflow:hidden}
.hidepast .r.past{display:none}
.r b{color:var(--mu);font-variant-numeric:tabular-nums}
.r.past{opacity:.28}
.cell div{padding:.1vh 0}
.cell.nc.next{color:var(--c1);font-weight:700}
.cell.ni.next{color:var(--c2);font-weight:700}
.empty{color:var(--mu);font-size:min(1.8vw,3.4vh);padding-top:1.5vh}
.side{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:1.6vw;min-height:0}
.photo{flex:4;position:relative;padding:0;background:#000}
.ph{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;overflow:hidden}
.ph.on{opacity:1}
.ph::before{content:"";position:absolute;inset:-6%;background:var(--u) center/cover no-repeat;filter:blur(28px) brightness(.5)}
.ph::after{content:"";position:absolute;inset:0;background:var(--u) center/contain no-repeat}
.noph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:min(1.8vw,3.4vh);text-align:center;padding:2vw}
.rec{flex:1;display:flex;flex-direction:column;justify-content:center}
.rec h2{margin:0 0 1vh;font-size:min(1.6vw,3vh);letter-spacing:.06em;color:#ffd166}
#rt{font-size:min(2.4vw,4.6vh);font-weight:600;line-height:1.25;transition:opacity .5s}
.tools{position:fixed;right:.8vw;bottom:.8vw;display:flex;gap:.5vw;opacity:.15;transition:opacity .3s;z-index:5}
.tools:hover,.tools:focus-within{opacity:1}
.tools button{background:#222c3b;color:var(--tx);border:0;border-radius:8px;font-size:max(18px,1.6vw);padding:.5vw .9vw;cursor:pointer}
dialog{background:#171f2b;color:var(--tx);border:1px solid #2b3849;border-radius:16px;padding:22px;width:min(620px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog p{color:var(--mu);font-size:15px;line-height:1.5;margin:8px 0}
input{width:100%;background:#0f151e;color:var(--tx);border:1px solid #2b3849;border-radius:8px;padding:10px;font:inherit;font-size:16px;margin-top:6px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns button{background:#2a3a52;color:var(--tx);border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
@media (max-aspect-ratio:1/1){body{overflow:auto}.grid{grid-template-columns:1fr;height:auto}.side{grid-column:1;grid-row:auto;min-height:90vh}.top{flex-wrap:wrap}.ahead,.r{font-size:18px}}
</style>
</head>
<body>
<div class="grid">
  <section class="card top">
    <div><div id="time">--:--</div><div id="date"></div><div id="greet"></div></div>
    <div class="weather"><div id="wi">⏳</div><div><div id="wt">--°C</div><div id="wc">Buscando o clima…</div><div id="wm"></div></div></div>
  </section>
  <section class="card agenda">
    <div class="ahead"><span></span><h2 class="c">CAIO</h2><h2 class="i">ISADORA</h2></div>
    <div id="agb"></div>
  </section>
  <div class="side">
    <section class="card photo"><div class="ph on" id="pa"></div><div class="ph" id="pb"></div><div class="noph" id="nop">Sem fotos ainda.<br>Adicione links na planilha (tipo: foto).</div></section>
    <section class="card rec"><h2>RECADOS</h2><div id="rt"></div></section>
  </div>
</div>
<div class="tools"><button id="fs" title="Tela cheia">⛶</button><button id="cfg" title="Configurar planilha">⚙</button></div>

<dialog id="dlg">
  <h3 style="margin:0 0 6px">Ligar à planilha</h3>
  <p>Cole aqui o link da planilha publicada como CSV (Arquivo → Compartilhar → Publicar na Web → formato CSV).</p>
  <input id="url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
  <div class="btns"><button id="ok">Salvar</button><button id="cancel">Fechar</button></div>
</dialog>

<script>
// Se quiser, cole o link da planilha aqui e não precisa configurar na tela:
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSxNuoUJ6PvQM9rnhgWEV-gEyTt0gwGvHiaIffnmIlXrE_IE8HLbz-3WeOwo_PZgkG-jN2zVc8AL_ou/pub?gid=2039905258&single=true&output=csv';
// Local do clima (Curitibanos, SC)
const LAT=-27.2833,LON=-50.5833;

const KEY='painelTV2';
const $=id=>document.getElementById(id);
let URLCSV=(SHEET_URL||localStorage.getItem(KEY)||'').trim();
let D={caio:[],isadora:[],recado:[],foto:[]};

/* ---------- agenda unificada ---------- */
function agenda(now){
  const box=$('agb');box.textContent='';
  const rows=new Map();let u=0;
  const nx={caio:9998,isadora:9998};
  ['caio','isadora'].forEach(p=>D[p].forEach(i=>{
    const m=i.h.match(/^(\d{1,2}):(\d{2})/);
    const t=m?+m[1]*60+ +m[2]:9999;
    const key=m?String(t):'u'+(u++);
    if(!rows.has(key))rows.set(key,{t:t,h:m?m[1].padStart(2,'0')+':'+m[2]:'•',caio:[],isadora:[]});
    rows.get(key)[p].push(i.x);
    if(t>=now&&t<9999&&t<nx[p])nx[p]=t;
  }));
  if(!rows.size){const e=document.createElement('div');e.className='empty';e.textContent='Nada por enquanto.';box.appendChild(e);return}
  [...rows.values()].sort((a,b)=>a.t-b.t).forEach(r=>{
    const row=document.createElement('div');row.className='r'+(r.t<now?' past':'');
    const b=document.createElement('b');b.textContent=r.h;row.appendChild(b);
    [['caio','nc'],['isadora','ni']].forEach(([p,c])=>{
      const cell=document.createElement('div');cell.className='cell '+c+(r.t===nx[p]?' next':'');
      r[p].forEach(x=>{const d=document.createElement('div');d.textContent=x;cell.appendChild(d)});
      row.appendChild(cell);
    });
    box.appendChild(row);
  });
  fit(box);
}
function fit(box){
  box.classList.remove('hidepast');let k=1;box.style.setProperty('--k',k);
  while(box.scrollHeight>box.clientHeight+1&&k>.55){k-=.05;box.style.setProperty('--k',k)}
  if(box.scrollHeight>box.clientHeight+1)box.classList.add('hidepast');
}
function tick(){
  const d=new Date(),now=d.getHours()*60+d.getMinutes();
  $('time').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const s=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('date').textContent=s.charAt(0).toUpperCase()+s.slice(1);
  const h=d.getHours();$('greet').textContent=h<12?'Bom dia!':h<18?'Boa tarde!':'Boa noite!';
  const k=now+'|'+JSON.stringify(D.caio)+JSON.stringify(D.isadora);
  if(k!==tick.k){tick.k=k;agenda(now)}
}

/* ---------- clima (Open-Meteo, automático) ---------- */
const WC={0:['☀️','Céu limpo'],1:['🌤️','Poucas nuvens'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],45:['🌫️','Neblina'],48:['🌫️','Neblina'],51:['🌦️','Garoa'],53:['🌦️','Garoa'],55:['🌦️','Garoa forte'],61:['🌧️','Chuva fraca'],63:['🌧️','Chuva'],65:['🌧️','Chuva forte'],71:['❄️','Neve'],73:['❄️','Neve'],75:['❄️','Neve'],80:['🌧️','Pancadas de chuva'],81:['🌧️','Pancadas de chuva'],82:['🌧️','Chuva forte'],95:['⛈️','Tempestade'],96:['⛈️','Tempestade'],99:['⛈️','Tempestade']};
async function weather(){
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=1';
    const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();
    const c=j.current,d=j.daily,w=WC[c.weather_code]||['🌡️','—'];
    $('wi').textContent=(!c.is_day&&c.weather_code<=1)?'🌙':w[0];
    $('wt').textContent=Math.round(c.temperature_2m)+'°C';
    $('wc').textContent=w[1];
    $('wm').textContent='Mín. '+Math.round(d.temperature_2m_min[0])+'° · Máx. '+Math.round(d.temperature_2m_max[0])+'° · Chuva '+d.precipitation_probability_max[0]+'%';
  }catch(e){if($('wc').textContent.startsWith('Buscando'))$('wc').textContent='Clima indisponível'}
}

/* ---------- planilha ---------- */
function csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function img(u){u=u.trim();const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?.*id=([\w-]+)/);return m?'https://lh3.googleusercontent.com/d/'+m[1]+'=w1600':u}
function apply(txt){
  const n={caio:[],isadora:[],recado:[],foto:[]};
  csv(txt).forEach(r=>{
    const t=norm(r[0]);if(!t||t==='tipo')return;
    const h=(r[1]||'').trim(),x=(r[2]||'').trim();
    if(t==='caio'||t==='isadora'){if(x||h)n[t].push({h:x?h:'',x:x||h})}
    else if(t==='recado'||t==='recados'){const m=x||h;if(m)n.recado.push(m)}
    else if(t==='foto'||t==='fotos'){(x||h).split(/[\s,;]+/).forEach(l=>{if(/^https?:/i.test(l))n.foto.push(img(l))})}
  });
  D=n;tick();
  if(ri>=D.recado.length)ri=0;if(pi>=D.foto.length)pi=0;
  $('nop').style.display=D.foto.length?'none':'flex';
  if(!D.foto.length){$('pa').classList.remove('on');$('pb').classList.remove('on')}
}
async function load(){
  if(!URLCSV)return;
  try{
    const res=await fetch(URLCSV+(URLCSV.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw 0;const txt=await res.text();
    try{localStorage.setItem(KEY+'d',txt)}catch(e){}
    apply(txt);
  }catch(e){const c=localStorage.getItem(KEY+'d');if(c)apply(c)}
}

/* ---------- recados e fotos ---------- */
let ri=0,pi=0,front=true;
function recado(){
  const t=$('rt');t.style.opacity=0;
  setTimeout(()=>{
    t.textContent=D.recado.length?D.recado[ri%D.recado.length]:'Sem recados. Escreva um na planilha.';
    t.style.opacity=1;ri=(ri+1)%Math.max(D.recado.length,1);
  },400);
}
function alt(u){const m=u.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1600':null}
function foto(tries){
  if(!D.foto.length)return;
  tries=tries||0;
  const u=D.foto[pi%D.foto.length];pi=(pi+1)%D.foto.length;
  const show=src=>{
    const a=$(front?'pb':'pa'),b=$(front?'pa':'pb');
    a.style.setProperty('--u','url("'+src+'")');a.classList.add('on');b.classList.remove('on');front=!front;
  };
  const im=new Image();
  im.onload=()=>show(im.src);
  im.onerror=()=>{
    const a2=alt(u);
    if(a2){const i2=new Image();i2.onload=()=>show(a2);i2.onerror=()=>{if(tries<D.foto.length)setTimeout(()=>foto(tries+1),300)};i2.src=a2}
    else if(tries<D.foto.length)setTimeout(()=>foto(tries+1),300);
  };
  im.src=u;
}

/* ---------- configuração ---------- */
$('cfg').onclick=()=>{$('url').value=URLCSV;$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('ok').onclick=()=>{URLCSV=$('url').value.trim();try{localStorage.setItem(KEY,URLCSV)}catch(e){}$('dlg').close();load()};
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

window.addEventListener('resize',()=>{tick.k='';tick()});
tick();weather();recado();
if(!URLCSV){$('url').value='';setTimeout(()=>$('dlg').showModal(),400)}else load();
setInterval(tick,1000);
setInterval(weather,15*60*1000);
setInterval(load,60*1000);
setInterval(recado,10000);
setInterval(foto,10000);
setTimeout(foto,2500);
try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
</script>
</body>
</html>
